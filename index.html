function skip(){ask('Passer ce niveau ?','Passer',()=>{S.l[mode]=lvl+1;delete S.sv[mode];save();lvl++;init()})}
function won(){S.d[mode]++;mis();S.hl+=2;S.hm+=1;S.l[mode]=lvl+1;delete S.sv[mode];save();hb();$('wt').textContent='Niveau '+lvl+' terminé !';$('win').classList.add('on');conf()}
function conf(){const o=$('win');o.querySelectorAll('.cf').forEach(x=>x.remove());for(let i=0;i<40;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},85%,62%);animation-delay:${Math.random()*.6}s;animation-duration:${1.7+Math.random()}s`;o.appendChild(d)}}
function fit(){
 const gw=$('gw'),o=mode==='m'?M:F,W=mode==='m'?M.N:F.W,H=mode==='m'?M.N:F.H;
 const c=Math.max(16,Math.min(62,Math.floor(Math.min((gw.clientWidth-28)/W,(gw.clientHeight-42)/H))));
 o.c=c;$('grid').style.cssText=`--c:${c}px;grid-template-columns:repeat(${W},${c}px);grid-template-rows:repeat(${H},${c}px)`;if(mode==='f')fitTxt()}
function fitTxt(){const ks=[...document.querySelectorAll('.K')],ms=ks.map(k=>{const sp=[...k.querySelectorAll('.cb span')];let m=99;sp.forEach(x=>{const b=x.parentNode,cs=getComputedStyle(b),aw=b.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);let f=F.c*.2;x.style.fontSize=f+'px';x.style.overflowWrap='normal';while(f>7&&(x.offsetHeight>ah||x.offsetWidth>aw)){f-=.5;x.style.fontSize=f+'px'}if(x.offsetWidth>aw)x.style.overflowWrap='anywhere';m=Math.min(m,f)});return m}),so=[...ms].sort((a,b)=>a-b),g=Math.max(7,so[Math.floor(so.length*.3)]||8);ks.forEach((k,i)=>k.querySelectorAll('.cb span').forEach(x=>x.style.fontSize=Math.min(ms[i],g)+'px'))}
addEventListener('resize',()=>{if($('game').classList.contains('on'))fit()});
/* ---- Mots mêlés ---- */
function initM(){
 $('ctl').innerHTML=`<div id="chips"></div><div class="tb"><button class="bt" id="hi">Indice (${S.hl})</button><button class="bt" id="ps">Passer</button></div>`;
 const gw=$('gw'),sv=S.sv.m&&S.sv.m.l===lvl&&S.sv.m.N?S.sv.m:null,t=lvl<=5?32:lvl<=20?30:lvl<=40?28:27;
 const N=sv?sv.N:Math.max(9,Math.min(13,Math.floor(Math.min(gw.clientWidth-28,gw.clientHeight-42)/t)));
 M=genM(lvl,N);M.found=new Set(sv?sv.f.filter(a=>M.ws.some(w=>w.a===a)):[]);M.cur=[];M.el=[];M.mask=lvl>=12;
 $('chips').innerHTML=M.ws.map((w,i)=>`<span class="ch" data-w="${w.a}" data-i="${i}"></span>`).join('');
 $('hi').onclick=()=>{const u=M.ws.filter(w=>!M.found.has(w.a));if(!u.length){toast('Tout est trouvé');return}if(!use('l',$('hi')))return;const w=u[Math.random()*u.length|0],[r,c]=w.cs[0];M.el[r][c].classList.add('ht');setTimeout(()=>M.el[r][c].classList.remove('ht'),2500)};
 $('ps').onclick=skip;
 const g=$('grid');g.innerHTML='';
 for(let r=0;r<M.N;r++){M.el[r]=[];for(let c=0;c<M.N;c++){const d=document.createElement('div');d.className='cell M'+((r+c)%2?' o':'');d.textContent=M.g[r][c];g.appendChild(d);M.el[r][c]=d}}
 fit();paintM()}
const PAL=[350,24,45,142,174,200,226,268,300,330];
function paintM(){
 const fd={};[...M.found].forEach(a=>{const i=M.ws.findIndex(w=>w.a===a);M.ws[i].cs.forEach(([r,c])=>fd[r+','+c]=PAL[i%PAL.length])});
 const sl=new Set(M.cur.map(x=>x+''));
 for(let r=0;r<M.N;r++)for(let c=0;c<M.N;c++){const d=M.el[r][c],k=r+','+c;d.classList.toggle('sl',sl.has(k));d.classList.toggle('fd',k in fd);d.style.background=k in fd?`hsl(${fd[k]},78%,58%)`:''}
 document.querySelectorAll('.ch').forEach(e=>{const w=e.dataset.w,f=M.found.has(w),h=PAL[+e.dataset.i%PAL.length];e.classList.toggle('on',f);e.textContent=f||!M.mask?w:w[0]+'·'.repeat(w.length-1);e.style.background=f?`hsl(${h},72%,50%)`:`hsl(${h},100%,94%)`;e.style.color=f?'#fff':'#2b2570';e.style.boxShadow=`inset 0 0 0 2px hsl(${h},75%,${f?50:72}%)`});
 $('pgs').textContent=M.found.size+'/'+M.ws.length+' mots'}
function mc(e){const b=$('grid').getBoundingClientRect(),x=Math.floor((e.clientX-b.left)/M.c),y=Math.floor((e.clientY-b.top)/M.c);return x>=0&&y>=0&&x<M.N&&y<M.N?[y,x]:null}
function line(s,p){let dr=p[0]-s[0],dc=p[1]-s[1];const n=Math.max(Math.abs(dr),Math.abs(dc));let sr=Math.sign(dr),sc=Math.sign(dc);
 if(Math.abs(dr)>2*Math.abs(dc))sc=0;else if(Math.abs(dc)>2*Math.abs(dr))sr=0;
 const o=[];for(let i=0;i<=n;i++){const r=s[0]+sr*i,c=s[1]+sc*i;if(r<0||c<0||r>=M.N||c>=M.N)break;o.push([r,c])}return o}
const gr=$('grid');let ms=null;
gr.onpointerdown=e=>{if(mode!=='m')return;ms=mc(e);if(!ms)return;gr.setPointerCapture(e.pointerId);M.cur=[ms];paintM()};
gr.onpointermove=e=>{if(mode!=='m'||!ms)return;const p=mc(e);if(p){M.cur=line(ms,p);paintM()}};
gr.onpointerup=()=>{
 if(mode!=='m'||!ms)return;ms=null;
 const s=M.cur.map(([r,c])=>M.g[r][c]).join(''),z=[...s].reverse().join('');
 const w=M.ws.find(w=>!M.found.has(w.a)&&(w.a===s||w.a===z));M.cur=[];
 if(w){M.found.add(w.a);S.sv.m={l:lvl,f:[...M.found],N:M.N};save();toast('Trouvé : '+w.a);w.cs.forEach(([r,c],n)=>{const d=M.el[r][c];d.style.setProperty('--i',n);d.classList.add('pp')});setTimeout(()=>w.cs.forEach(([r,c])=>M.el[r][c].classList.remove('pp')),1300);if(navigator.vibrate)navigator.vibrate(20)}
 paintM();if(M.found.size===M.ws.length)setTimeout(won,1300)};
/* ---- Mots fléchés ---- */
function initF(){
 const rows=['AZERTYUIOP','QSDFGHJKLM','WXCVBN⌫'];
 $('ctl').innerHTML=`<div class="tb"><button class="bt" id="bl">Lettre (${S.hl})</button><button class="bt" id="bm">Mot (${S.hm})</button><button class="bt" id="bv">Vérifier</button><button class="bt" id="ps">Passer</button></div>
 <div class="cr"><button class="nv" id="pv">◀</button><div id="cl"></div><button class="nv" id="nt">▶</button></div>
 ${rows.map(r=>`<div class="kb">${[...r].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>`).join('')}`;
 $('ctl').onclick=e=>{const k=e.target.closest('[data-k]');if(k)k.dataset.k==='⌫'?backF():typeF(k.dataset.k)};
 $('pv').onclick=()=>nav(-1);$('nt').onclick=()=>nav(1);$('ps').onclick=skip;
 $('bl').onclick=()=>{const [r,c]=F.sel,k=r+','+c;if(F.i[k]===F.g[r][c].ch){toast('Cette lettre est déjà juste');return}if(!use('l',$('bl')))return;F.i[k]=F.g[r][c].ch;F.bad.delete(k);adv();saveF();after()};
 $('bm').onclick=()=>{const e=F.ents[F.ei];if(entOk(e)){toast('Ce mot est déjà complet');return}if(!use('m',$('bm')))return;reveal(e.cells)};
 $('bv').onclick=()=>{if(!Object.keys(F.i).length){toast('Rien à vérifier');return}let n=0;for(const k in F.i){const [r,c]=k.split(',');if(F.i[k]!==F.g[r][c].ch){F.bad.add(k);n++}}toast(n?n+' erreur'+(n>1?'s':'')+' en rouge':'Tout est juste jusqu’ici');paintF()};
 const sv=S.sv.f&&S.sv.f.l===lvl&&S.sv.f.W?S.sv.f:null,gw=$('gw'),t=lvl<=10?48:lvl<=30?44:41,cl2=(v,a,b)=>Math.max(a,Math.min(b,v));
 const W=sv?sv.W:cl2(Math.floor((gw.clientWidth-28)/t),5,9),H=sv?sv.H:cl2(Math.floor((gw.clientHeight-42)/t),6,11);
 F=genF(lvl,W,H);F.i=sv?sv.i:{};F.bad=new Set();F.cm={};F.el=[];
 F.ents.forEach((e,i)=>e.cells.forEach(([r,c])=>{(F.cm[r+','+c]=F.cm[r+','+c]||[]).push(i)}));
 F.ei=0;F.sel=F.ents[0].cells[0];
 const g=$('grid');g.innerHTML='';
 for(let r=0;r<F.H;r++){F.el[r]=[];for(let c=0;c<F.W;c++){const k=F.g[r][c],d=document.createElement('div');d.className='cell '+(k.k===1?'L':k.k===2?'K':'X');d.dataset.r=r;d.dataset.c=c;
  if(k.k===2)d.innerHTML=['r','d'].filter(x=>k.cl[x]).map(x=>`<div class="cb ${x}"><span>${k.cl[x].t}</span><i class="${x}">${x==='r'?'▶':'▼'}</i></div>`).join('');
  g.appendChild(d);F.el[r][c]=d}}
 F.done=new Set();F.anim=new Set();F.shk=new Set();F.fin=0;scan(true);fit();paintF()}
$('grid').onclick=e=>{if(mode!=='f')return;const d=e.target.closest('.cell');if(d){const b=d.getBoundingClientRect();selF(+d.dataset.r,+d.dataset.c,(e.clientY-b.top)/b.height)}};
const entOk=e=>e.cells.every(([r,c])=>F.i[r+','+c]===F.g[r][c].ch),entFull=e=>e.cells.every(([r,c])=>F.i[r+','+c]);
const firstEmpty=e=>e.cells.find(([r,c])=>!F.i[r+','+c])||e.cells[0];
function selF(r,c,fy){const k=F.g[r][c];
 if(k.k===1){const l=F.cm[r+','+c];if(F.sel[0]===r&&F.sel[1]===c&&l.length>1)F.ei=l[(l.indexOf(F.ei)+1)%l.length];else if(!l.includes(F.ei))F.ei=l[0];F.sel=[r,c]}
 else if(k.k===2){const ix=F.ents.map((e,i)=>e.R===r&&e.C===c?i:-1).filter(i=>i>=0);if(!ix.length)return;let i=ix[0];
  if(ix.length>1){const w=fy>.5?1:0,f=ix.find(x=>F.ents[x].d===w);i=f===undefined?ix[0]:f}
  F.ei=i;F.sel=firstEmpty(F.ents[i])}
 paintF()}
function nav(d){const n=F.ents.length;F.ei=(F.ei+d+n)%n;F.sel=firstEmpty(F.ents[F.ei]);paintF()}
function paintF(){
 const e=F.ents[F.ei],act=new Set(e.cells.map(x=>x+'')),dn=new Set();F.done.forEach(i=>F.ents[i].cells.forEach(x=>dn.add(x+'')));
 for(let r=0;r<F.H;r++)for(let c=0;c<F.W;c++){if(F.g[r][c].k!==1)continue;const k=r+','+c;
  F.el[r][c].className='cell L'+(act.has(k)?' a':'')+(dn.has(k)?' ok':'')+(F.sel[0]===r&&F.sel[1]===c?' s':'')+(F.bad.has(k)?' w':'')+(F.anim.has(k)?' pp':'')+(F.shk.has(k)?' sk':'');F.el[r][c].textContent=F.i[k]||''}
 $('cl').textContent=`${e.d?'↓':'→'} ${e.t} (${e.a.length})`;$('cl').classList.toggle('dn',F.done.has(F.ei));
 const g=$('pgs');if(g)g.textContent=F.done.size+'/'+F.ents.length+' mots'}
function saveF(){S.sv.f={l:lvl,i:F.i,W:F.W,H:F.H};save()}
function scan(silent){F.ents.forEach((e,i)=>{const o=entOk(e);if(F.done.has(i)&&!o)F.done.delete(i);else if(!F.done.has(i)&&o){F.done.add(i);if(!silent)celebrate(e)}})}
function celebrate(e){e.cells.forEach(([r,c],n)=>{F.anim.add(r+','+c);F.el[r][c].style.setProperty('--i',n)});setTimeout(()=>{e.cells.forEach(([r,c])=>F.anim.delete(r+','+c));paintF()},1200);if(navigator.vibrate)navigator.vibrate(20)}
function shake(e){e.cells.forEach(([r,c])=>F.shk.add(r+','+c));paintF();setTimeout(()=>{e.cells.forEach(([r,c])=>F.shk.delete(r+','+c));paintF()},500)}
function after(){
 const n0=F.done.size,cur=F.ei,e=F.ents[cur];scan();paintF();
 if(F.done.size===F.ents.length){if(!F.fin){F.fin=1;setTimeout(won,1300)}return}
 if(F.done.has(cur)&&F.done.size>n0)setTimeout(()=>{if(F.ei!==cur||F.fin)return;for(let k=1;k<=F.ents.length;k++){const j=(cur+k)%F.ents.length;if(!F.done.has(j)){F.ei=j;F.sel=firstEmpty(F.ents[j]);break}}paintF()},800);
 else if(entFull(e)&&!entOk(e)){shake(e);toast('Un mot ne colle pas : essaie « Vérifier »')}}
function adv(){const e=F.ents[F.ei],i=e.cells.findIndex(x=>x[0]===F.sel[0]&&x[1]===F.sel[1]);if(i>=0&&i<e.cells.length-1){const j=e.cells.findIndex((x,n)=>n>i&&!F.i[x[0]+','+x[1]]);F.sel=e.cells[j>0?j:i+1]}}
function typeF(ch){const k=F.sel[0]+','+F.sel[1];F.i[k]=ch;F.bad.delete(k);adv();saveF();after()}
function backF(){const e=F.ents[F.ei];let k=F.sel[0]+','+F.sel[1];
 if(!F.i[k]){const i=e.cells.findIndex(x=>x[0]===F.sel[0]&&x[1]===F.sel[1]);if(i>0){F.sel=e.cells[i-1];k=F.sel[0]+','+F.sel[1]}}
 delete F.i[k];F.bad.delete(k);saveF();scan(true);paintF()}
function reveal(cs){cs.forEach(([r,c])=>{F.i[r+','+c]=F.g[r][c].ch;F.bad.delete(r+','+c)});saveF();after()}
document.addEventListener('keydown',e=>{if(!$('game').classList.contains('on')||mode!=='f')return;if(/^[a-z]$/i.test(e.key))typeF(e.key.toUpperCase());else if(e.key==='Backspace')backF()});
home();
</script></body></html>
